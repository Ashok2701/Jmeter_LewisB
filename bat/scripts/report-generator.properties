# Extra JMeter properties for the HTML dashboard step of run_jmeter_test.bat.
# Passed with -q so the JMeter installation itself is never modified.
#
# The test plan writes two samples per CSV row: the internal
# "Prepare - <Method> <Path>" JSR223 sampler, which resolves variables and
# makes no network call, and the real HTTP request that follows it. Counting
# both doubled every figure in the report - 29 APIs were reported as 58
# samples - and halved the error rate, so a run in which every API call
# failed still showed 50% errors.
#
# This filter keeps only the samples that are not Prepare samplers, so the
# Passed / Failed counts, success rate, statistics, APDEX, errors tables and
# every graph are built from actual API requests alone.
#
# Rows that carry no Method/URL still produce a "<Method> <Path> (SKIPPED)"
# sample; those are real API rows the run could not execute, so they are
# deliberately left in.
#
# Regular expression: any sample name that does not start with "Prepare - ".
jmeter.reportgenerator.sample_filter=^(?!Prepare - ).*
